<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#47701C">
<title>Kasir Mbo Suti</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Layar pengaturan URL server (muncul sekali di perangkat baru kalau config.js kosong) -->
<section id="setup" class="hidden" style="min-height:100dvh;display:grid;place-items:center;padding:24px 16px">
  <div class="login-card">
    <img src="icons/logo.png" alt="Logo Pecel Pincuk Mbo Suti">
    <h1>Sambungkan Server</h1>
    <div class="sub">Tempel URL Web App Google Apps Script (berakhiran <b>/exec</b>).</div>
    <form id="setup-form">
      <label class="field"><span>URL Web App</span><input id="setup-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" required></label>
      <div id="setup-err"></div>
      <button class="btn btn-primary btn-block" type="submit">Simpan &amp; Tes</button>
    </form>
  </div>
</section>

<!-- Login -->
<section id="login" class="hidden">
  <div class="login-card">
    <img src="icons/logo.png" alt="Logo Pecel Pincuk Mbo Suti">
    <h1>Kasir Mbo Suti</h1>
    <div class="sub">Pecel Pincuk khas Surabaya</div>
    <div class="seg" role="tablist">
      <button type="button" class="on" data-role="kasir">Kasir</button>
      <button type="button" data-role="admin">Admin</button>
    </div>
    <form id="login-form">
      <label class="field" id="f-user"><span>Nama kasir</span><select id="lg-user"></select></label>
      <label class="field hidden" id="f-email"><span>Email admin</span><input id="lg-email" type="email" autocomplete="username"></label>
      <label class="field"><span id="pin-l">PIN 6 angka</span><input id="lg-pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <div id="login-err"></div>
      <button class="btn btn-primary btn-block" id="login-btn" type="submit" style="margin-top:4px">Masuk</button>
    </form>
    <div class="hint" id="login-hint"></div>
  </div>
</section>

<!-- Aplikasi -->
<section id="app" class="hidden">
  <header class="topbar">
    <img src="icons/logo.png" alt="">
    <div class="brand"><b>Mbo Suti</b><small id="sub-l"></small></div>
    <div class="sp"></div>
    <button class="sync" id="sync" title="Status sinkron" style="border:0;color:inherit"><span class="dot"></span><span id="sync-t">Live</span></button>
    <div class="who"><span class="role-pill" id="role-pill"></span></div>
    <button class="icon-btn" title="Keluar" id="logout-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </header>
  <div class="body">
    <nav class="side" id="nav-side"></nav>
    <div style="min-width:0">
      <nav class="tabs" id="nav-tabs"></nav>
      <main id="main"></main>
    </div>
  </div>
</section>

<div id="print"></div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="vendor/xlsx.full.min.js" defer></script>
<script src="printer.js"></script>
<script src="app.js"></script>
</body>
</html>
